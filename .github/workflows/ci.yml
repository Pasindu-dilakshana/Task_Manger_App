name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build step (which loads env vars but doesn't
          # actually connect to Mongo at build time) doesn't fail on missing
          # required env vars. Real values live in Vercel/Amplify's own
          # environment variable settings, never in this repo.
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'placeholder-build-time-secret' }}

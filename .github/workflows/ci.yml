name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:

          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://pasiya:pasindu12345@ac-njcwre8-shard-00-00.ytylznr.mongodb.net:27017,ac-njcwre8-shard-00-01.ytylznr.mongodb.net:27017,ac-njcwre8-shard-00-02.ytylznr.mongodb.net:27017/?ssl=true&replicaSet=atlas-ub889c-shard-0&authSource=admin&appName=Cluster0' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'b63a4a6f93993da8ff05b9db3cd8b47563d6aa551af98c09c15fd8e5e766dac6' }}
